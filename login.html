<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="./">
    <title>Đăng nhập | TP.HCM Guide</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body class="page account-page">
    <main class="account-shell">
        <section class="account-card" aria-labelledby="login-title">
            <div class="account-brand">TP.HCM GUIDE</div>
            <span class="info-category">CHÀO MỪNG TRỞ LẠI</span>
            <h1 id="login-title">Đăng nhập</h1>
            <p class="account-intro">Đăng nhập để lưu lại những địa điểm yêu thích và nhận các gợi ý khám phá thành phố.</p>
            <form id="login-page-form" class="account-form">
                <label for="login-email">Email</label>
                <input id="login-email" type="email" placeholder="email@example.com" required>
                <label for="login-password">Mật khẩu</label>
                <input id="login-password" type="password" placeholder="Nhập mật khẩu" required>
                <label class="account-check" for="show-login-password"><input id="show-login-password" type="checkbox"> Hiện mật khẩu</label>
                <button type="submit" class="account-submit">ĐĂNG NHẬP</button>
            </form>
            <p id="login-message" class="account-message" aria-live="polite"></p>
            <p class="account-switch">Chưa có tài khoản? <a href="./register.html">Đăng ký ngay</a></p>
            <a href="./index.html" class="back-button">← Quay lại trang chủ</a>
        </section>
    </main>
    <script>
        const loginPassword = document.getElementById('login-password');
        const showLoginPassword = document.getElementById('show-login-password');
        const loginForm = document.getElementById('login-page-form');
        const loginMessage = document.getElementById('login-message');

        showLoginPassword.addEventListener('change', () => {
            loginPassword.type = showLoginPassword.checked ? 'text' : 'password';
        });

        loginForm.addEventListener('submit', (event) => {
            event.preventDefault();
            loginMessage.textContent = 'Đăng nhập thành công! Chào mừng bạn trở lại.';
            loginForm.reset();
            loginPassword.type = 'password';
        });
    </script>
</body>
</html>
