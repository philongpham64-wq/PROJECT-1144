<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông tin Dinh Độc Lập</title>

    <link rel="stylesheet" href="styles.css">

    <style>
        .info-page {
            max-width: 900px;
            margin: 0 auto;
            padding: 50px 20px 70px;
        }

        .info-card {
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.09);
        }

        .info-category {
            font-size: 14px;
            font-weight: bold;
            opacity: 0.6;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-card h1 {
            margin: 10px 0 18px;
            font-size: 34px;
        }

        .info-intro {
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .info-content {
            line-height: 1.8;
            font-size: 16px;
        }

        .info-content h2 {
            margin-top: 28px;
        }

        .info-content p {
            margin: 12px 0;
        }

        .info-content ul {
            padding-left: 25px;
        }

        .back-button {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 20px;
            border-radius: 10px;
            text-decoration: none;
            background: #173b59;
            color: white;
            transition: 0.2s;
        }

        .back-button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        @media (max-width: 600px) {
            .info-card {
                padding: 25px;
            }

            .info-card h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body class="page">

    <main class="info-page">

        <article class="info-card">

            <div id="category" class="info-category"></div>

            <h1 id="title"></h1>

            <div id="intro" class="info-intro"></div>

            <div id="content" class="info-content"></div>

            <a href="blank.html" class="back-button">
                ← Quay lại các chủ đề
            </a>

        </article>

    </main>

    <script>

        const boxData = {

            1: {
                category: "Lịch sử",
                title: "Lịch sử hình thành Dinh Độc Lập",
                intro: "Dinh Độc Lập là một công trình có lịch sử hình thành và biến đổi kéo dài hơn 150 năm.",

                content: `
                    <p>
                        Năm 1868, chính quyền Pháp tại Nam Kỳ bắt đầu xây dựng
                        Dinh Norodom tại vị trí của Dinh Độc Lập ngày nay.
                    </p>

                    <p>
                        Sau nhiều lần thay đổi về tên gọi và chức năng,
                        công trình trở thành một địa điểm quan trọng trong
                        lịch sử của Thành phố Hồ Chí Minh và Việt Nam.
                    </p>

                    <p>
                        Ngày 27/02/1962, Dinh cũ bị máy bay ném bom làm hư hại nặng.
                        Sau đó, chính quyền quyết định phá bỏ công trình cũ
                        để xây dựng một Dinh mới.
                    </p>

                    <p>
                        Dinh mới do kiến trúc sư Ngô Viết Thụ thiết kế,
                        khởi công ngày 01/07/1962 và khánh thành ngày 31/10/1966.
                    </p>

                    <p>
                        Ngày 30/04/1975 là một dấu mốc đặc biệt gắn liền với
                        Dinh Độc Lập và lịch sử Việt Nam hiện đại.
                    </p>
                `
            },

            2: {
                category: "Vị trí và quy mô",
                title: "Vị trí và quy mô",
                intro: "Dinh Độc Lập nằm tại trung tâm Thành phố Hồ Chí Minh và có khuôn viên rộng khoảng 12 ha.",

                content: `
                    <p>
                        Dinh Độc Lập hiện nằm tại số 135 Nam Kỳ Khởi Nghĩa,
                        phường Bến Thành, Thành phố Hồ Chí Minh.
                    </p>

                    <p>
                        Toàn bộ khuôn viên rộng khoảng 12 ha.
                        Đây là một khu vực rộng, có nhiều cây xanh,
                        sân bãi và các công trình phục vụ tham quan.
                    </p>

                    <p>
                        Phần công trình chính có diện tích mặt bằng khoảng
                        4.500 m², cao khoảng 26 m.
                    </p>

                    <p>
                        Dinh có tổng diện tích sử dụng khoảng 20.000 m²
                        với gần 100 phòng và nhiều khu vực chức năng khác nhau.
                    </p>
                `
            },

            3: {
                category: "Kiến trúc",
                title: "Kiến trúc Dinh Độc Lập",
                intro: "Dinh Độc Lập là công trình tiêu biểu cho sự kết hợp giữa kiến trúc hiện đại và những tư tưởng phương Đông.",

                content: `
                    <p>
                        Dinh Độc Lập được thiết kế bởi kiến trúc sư
                        Ngô Viết Thụ, một kiến trúc sư nổi tiếng của Việt Nam.
                    </p>

                    <p>
                        Công trình sử dụng ngôn ngữ kiến trúc hiện đại
                        nhưng kết hợp với các yếu tố truyền thống phương Đông.
                    </p>

                    <p>
                        Mặt bằng tổng thể của Dinh được tạo hình theo chữ
                        <strong>CÁT (吉)</strong>, mang ý nghĩa tốt lành.
                    </p>

                    <p>
                        Phòng Trình Quốc thư nằm ở vị trí trung tâm.
                        Nhiều chi tiết kiến trúc khác cũng được tạo hình
                        dựa trên những chữ Hán có ý nghĩa tượng trưng.
                    </p>

                    <p>
                        Một điểm nổi bật là hệ thống rèm hoa đá ở mặt tiền.
                        Hình thức này gợi liên tưởng đến các đốt tre
                        và đồng thời giúp che nắng cho công trình.
                    </p>
                `
            },

            4: {
                category: "Không gian",
                title: "Không gian bên trong Dinh",
                intro: "Bên trong Dinh Độc Lập có gần 100 phòng với nhiều chức năng khác nhau.",

                content: `
                    <p>
                        Dinh được thiết kế với nhiều khu vực phục vụ
                        các hoạt động làm việc, hội họp, tiếp khách và sinh hoạt.
                    </p>

                    <p>
                        Các phòng được bố trí theo một hệ thống rõ ràng,
                        kết hợp giữa tính trang trọng và công năng sử dụng.
                    </p>

                    <p>
                        Một số không gian tiêu biểu gồm phòng họp,
                        phòng làm việc, phòng tiếp khách, phòng trình quốc thư
                        và các khu vực dành cho hoạt động hành chính.
                    </p>

                    <p>
                        Nội thất của Dinh cũng được thiết kế phù hợp
                        với kiến trúc tổng thể, tạo nên sự thống nhất
                        giữa bên ngoài và bên trong công trình.
                    </p>
                `
            },

            5: {
                category: "Phòng họp",
                title: "Phòng Nội các",
                intro: "Phòng Nội các là một trong những không gian phục vụ hoạt động hội họp quan trọng tại Dinh.",

                content: `
                    <p>
                        Phòng Nội các được sử dụng cho các cuộc họp
                        của Hội đồng Nội các và những hoạt động liên quan
                        đến công việc điều hành.
                    </p>

                    <p>
                        Không gian phòng được bố trí trang trọng,
                        với bàn họp lớn và hệ thống ghế dành cho các thành viên
                        tham dự.
                    </p>

                    <p>
                        Khi tham quan, du khách có thể quan sát cách bố trí
                        nội thất và hình dung được một phần hoạt động
                        của bộ máy chính quyền trước năm 1975.
                    </p>
                `
            },

            6: {
                category: "Khu vực đặc biệt",
                title: "Hầm chỉ huy",
                intro: "Hệ thống hầm nằm dưới Dinh là một phần quan trọng trong thiết kế phục vụ liên lạc và chỉ huy.",

                content: `
                    <p>
                        Bên dưới Dinh Độc Lập có hệ thống hầm được xây dựng
                        nhằm phục vụ các hoạt động liên lạc, thông tin
                        và điều hành trong những tình huống đặc biệt.
                    </p>

                    <p>
                        Hệ thống này gồm nhiều khu vực chức năng,
                        được thiết kế kiên cố và kết nối với các khu vực
                        trong Dinh.
                    </p>

                    <p>
                        Đây là một trong những khu vực thu hút sự quan tâm
                        của du khách vì giúp thể hiện rõ hơn điều kiện
                        hoạt động và tổ chức của Dinh trong giai đoạn lịch sử đó.
                    </p>
                `
            },

            7: {
                category: "Kiến trúc",
                title: "Sân thượng và kỳ đài",
                intro: "Khu vực sân thượng có những chi tiết kiến trúc mang ý nghĩa đặc biệt.",

                content: `
                    <p>
                        Trên tầng cao của Dinh có khu vực được gọi là
                        <strong>Tứ phương vô sự lầu</strong>.
                    </p>

                    <p>
                        Khu vực này có hình dáng gắn với chữ
                        <strong>KHẨU (口)</strong>. Trong quan niệm thiết kế,
                        các hình thức này mang những ý nghĩa biểu tượng
                        chứ không chỉ nhằm mục đích trang trí.
                    </p>

                    <p>
                        Từ khu vực sân thượng có thể quan sát một phần
                        khuôn viên rộng lớn của Dinh và cảnh quan xung quanh.
                    </p>
                `
            },

            8: {
                category: "Tham quan",
                title: "Tham quan Dinh Độc Lập",
                intro: "Dinh Độc Lập hiện là một điểm tham quan và tìm hiểu lịch sử nổi bật tại Thành phố Hồ Chí Minh.",

                content: `
                    <p>
                        Du khách có thể đến Dinh Độc Lập để tìm hiểu
                        về lịch sử, kiến trúc và những sự kiện quan trọng
                        gắn với công trình.
                    </p>

                    <p>
                        Địa chỉ chính của Dinh là:
                        <strong>135 Nam Kỳ Khởi Nghĩa, phường Bến Thành,
                        Thành phố Hồ Chí Minh.</strong>
                    </p>

                    <p>
                        Khi tham quan, du khách có thể khám phá nhiều phòng
                        chức năng, khu vực bên trong Dinh, sân vườn
                        và hệ thống hầm.
                    </p>

                    <p>
                        Thời gian mở cửa và giá vé có thể thay đổi,
                        vì vậy nên kiểm tra thông tin mới nhất trên
                        trang thông tin chính thức của Dinh Độc Lập
                        trước khi đi.
                    </p>
                `
            },

            9: {
                category: "Giá trị",
                title: "Giá trị lịch sử và văn hóa",
                intro: "Dinh Độc Lập là một chứng tích lịch sử quan trọng và có giá trị lớn về kiến trúc, văn hóa và giáo dục.",

                content: `
                    <p>
                        Dinh Độc Lập gắn với nhiều sự kiện quan trọng
                        trong lịch sử Việt Nam hiện đại, đặc biệt là
                        những biến động của đất nước trong thế kỷ XX.
                    </p>

                    <p>
                        Công trình cũng là một ví dụ tiêu biểu cho
                        kiến trúc Việt Nam hiện đại, trong đó các yếu tố
                        truyền thống được kết hợp với tư duy kiến trúc mới.
                    </p>

                    <p>
                        Ngày 25/06/1976, Dinh Độc Lập được xếp hạng
                        là di tích lịch sử quốc gia.
                    </p>

                    <p>
                        Ngày nay, Dinh Độc Lập có vai trò quan trọng
                        trong việc bảo tồn di sản, giáo dục lịch sử
                        và giới thiệu văn hóa Việt Nam đến người dân
                        cũng như du khách quốc tế.
                    </p>
                `
            }

        };

        const params = new URLSearchParams(window.location.search);
        const box = params.get("box");
        const data = boxData[box] || boxData[1];

        document.getElementById("category").textContent = data.category;
        document.getElementById("title").textContent = data.title;
        document.getElementById("intro").textContent = data.intro;
        document.getElementById("content").innerHTML = data.content;

        document.title = data.title + " - Dinh Độc Lập";

    </script>

</body>
</html>
